name: Deploy Plugin to WordPress.org

on:
  workflow_dispatch:

env:
  PLUGIN_NAME: linknacional-file-browser
  PHP_VERSION: "8.2"
  DEPLOY_TAG: "1.1.0"

jobs:
  deploy-to-wp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch main
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: npm install and build
        run: |
          npm ci
          npm run build

      - name: Run composer install
        uses: php-actions/composer@v6
        with:
          php_version: ${{ env.PHP_VERSION }}
          working_dir: "."
          args: --ignore-platform-reqs
          command: install
          dev: no

      - name: Prepare plugin folder
        run: |
          mkdir -p build/${{ env.PLUGIN_NAME }}
          cp -r ./admin ./assets ./includes ./public ./languages ./vendor ./build/${{ env.PLUGIN_NAME }}
          cp ./*.php ./LICENSE.txt ./*.txt ./composer.json ./composer.lock ./build/${{ env.PLUGIN_NAME }}/
          rm -rf ./build/${{ env.PLUGIN_NAME }}/includes/assets/wordpressAssets
          find ./build -type f -exec chmod 0644 {} +
          find ./build -type d -exec chmod 0755 {} +

      - name: Deploy para WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          VERSION: ${{ env.DEPLOY_TAG }}
          SLUG: linknacional-file-browser
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          ASSETS_DIR: includes/assets/wordpressAssets
          BUILD_DIR: build/${{ env.PLUGIN_NAME }}
